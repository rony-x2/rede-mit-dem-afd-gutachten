<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 390" role="img" aria-labelledby="ds-titel ds-text"><title id="ds-titel">Aufbau von „Rede mit dem AfD-Gutachten“</title><desc id="ds-text">Einmalig wird die PDF der GFF vom Parser gegliedert und in Textteile zerlegt; ein lokales Sprachmodell schreibt typische Fragen dazu. Beides wird mit einem lokalen Einbettungsmodell zu Vektoren und landet mit Text, Fußnoten und Volltextindex in MariaDB. Bei jeder Frage ruft ein KI-Assistent die MCP-Schnittstelle auf; sie bettet die Frage ein, sucht in der Datenbank und liefert Fundstellen mit Seite und Link zurück.</desc><style>
.d-bahn{fill:#f6f8fa;stroke:#d1d9e0;stroke-dasharray:4 4}
.d-bahntitel{fill:#59636e;font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.d-kasten{fill:#ffffff;stroke:#d1d9e0;stroke-width:1.2}
.d-t{fill:#1f2328;font-size:15px;font-weight:600}
.d-d{fill:#59636e;font-size:12.5px}
.d-f{fill:#b5523b;font-size:11.5px;font-family:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,monospace}
.d-p{fill:none;stroke:#59636e;stroke-width:1.4;stroke-linejoin:round}
.d-p.b{stroke:#2f8a7b;stroke-width:1.6}
.d-s{fill:#59636e}.d-s.b{fill:#2f8a7b}
.d-l{fill:#59636e;font-size:11.5px}.d-l.b{fill:#2f8a7b}
.d-chip{fill:#ffffff;stroke:#2f8a7b;stroke-width:1.1}
.d-chiptext{fill:#2f8a7b;font-size:10.5px;font-weight:600;letter-spacing:.02em}
.d-hinweis{fill:#2f8a7b;font-size:11.5px;font-weight:600}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}</style><defs><marker id="ds-s" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-s" d="M0,0.6 L7.6,4 L0,7.4 z"/></marker><marker id="ds-sb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-s b" d="M0,0.6 L7.6,4 L0,7.4 z"/></marker></defs><rect class="d-kasten" x="20" y="110" width="150" height="70" rx="10"/><text class="d-t" x="95" y="141" text-anchor="middle">Frage</text><text class="d-d" x="95" y="159" text-anchor="middle">in eigenen Worten</text><rect class="d-kasten" x="200" y="110" width="200" height="70" rx="10"/><text class="d-t" x="300" y="141" text-anchor="middle">Frage einbetten</text><text class="d-d" x="300" y="159" text-anchor="middle">mit Suchanweisung</text><rect class="d-kasten" x="440" y="20" width="250" height="70" rx="10"/><text class="d-t" x="565" y="44" text-anchor="middle">Erzeugte Fragen</text><text class="d-d" x="565" y="62" text-anchor="middle">64 Dim. vorwählen, 384 sortieren</text><text class="d-f" x="565" y="80" text-anchor="middle">afd_frage_vektor</text><rect class="d-kasten" x="440" y="110" width="250" height="70" rx="10"/><text class="d-t" x="565" y="134" text-anchor="middle">Originaltext</text><text class="d-d" x="565" y="152" text-anchor="middle">Vektorindex, 300 Textteile</text><text class="d-f" x="565" y="170" text-anchor="middle">afd_vektor</text><rect class="d-kasten" x="440" y="200" width="250" height="70" rx="10"/><text class="d-t" x="565" y="224" text-anchor="middle">Volltext</text><text class="d-d" x="565" y="242" text-anchor="middle">FULLTEXT, kurze Wörter per RegExp</text><text class="d-f" x="565" y="260" text-anchor="middle">afd_absatz</text><rect class="d-kasten" x="730" y="110" width="200" height="70" rx="10"/><text class="d-t" x="830" y="141" text-anchor="middle">Rank Fusion</text><text class="d-d" x="830" y="159" text-anchor="middle">Gewichte 1,0 · 0,35 · 0,25</text><rect class="d-kasten" x="970" y="110" width="200" height="70" rx="10"/><text class="d-t" x="1070" y="141" text-anchor="middle">Fundstellen</text><text class="d-d" x="1070" y="159" text-anchor="middle">Seite, Ausschnitt, PDF-Link</text><rect class="d-kasten" x="440" y="300" width="250" height="70" rx="10"/><text class="d-t" x="565" y="324" text-anchor="middle">Angaben zur GFF</text><text class="d-d" x="565" y="342" text-anchor="middle">nur bei passender Frage</text><text class="d-f" x="565" y="360" text-anchor="middle">afd_herausgeberin</text><polyline class="d-p" points="170,145 198,145" marker-end="url(#ds-s)"/><polyline class="d-p" points="400,145 420,145 420,55 438,55" marker-end="url(#ds-s)"/><polyline class="d-p" points="420,145 438,145" marker-end="url(#ds-s)"/><polyline class="d-p" points="95,180 95,235 438,235" marker-end="url(#ds-s)"/><polyline class="d-p" points="300,180 300,335 438,335" marker-end="url(#ds-s)"/><polyline class="d-p b" points="690,55 710,55 710,145 728,145" marker-end="url(#ds-sb)"/><polyline class="d-p b" points="690,145 710,145 710,145 728,145" marker-end="url(#ds-sb)"/><polyline class="d-p b" points="690,235 710,235 710,145 728,145" marker-end="url(#ds-sb)"/><polyline class="d-p b" points="930,145 968,145" marker-end="url(#ds-sb)"/><polyline class="d-p b" points="690,335 1070,335 1070,182" marker-end="url(#ds-sb)"/><text class="d-l" x="185" y="230" text-anchor="start">Wörter der Frage</text></svg>
