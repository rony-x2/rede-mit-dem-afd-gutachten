<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 544" class="d-quer" role="img" aria-labelledby="dq-titel dq-text"><title id="dq-titel">Aufbau von „Rede mit dem AfD-Gutachten“</title><desc id="dq-text">Einmalig wird die PDF der GFF vom Parser gegliedert und in Textteile zerlegt; ein lokales Sprachmodell schreibt typische Fragen dazu. Beides wird mit einem lokalen Einbettungsmodell zu Vektoren und landet mit Text, Fußnoten und Volltextindex in MariaDB. Bei jeder Frage ruft ein KI-Assistent die MCP-Schnittstelle auf; sie bettet die Frage ein, sucht in der Datenbank und liefert Fundstellen mit Seite und Link zurück.</desc><style>
.d-bahn{fill:#f6f8fa;stroke:#d1d9e0;stroke-dasharray:4 4}
.d-bahntitel{fill:#59636e;font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.d-kasten{fill:#ffffff;stroke:#d1d9e0;stroke-width:1.2}
.d-t{fill:#1f2328;font-size:15px;font-weight:600}
.d-d{fill:#59636e;font-size:12.5px}
.d-f{fill:#b5523b;font-size:11.5px;font-family:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,monospace}
.d-p{fill:none;stroke:#59636e;stroke-width:1.4;stroke-linejoin:round}
.d-p.b{stroke:#2f8a7b;stroke-width:1.6}
.d-s{fill:#59636e}.d-s.b{fill:#2f8a7b}
.d-l{fill:#59636e;font-size:11.5px}.d-l.b{fill:#2f8a7b}
.d-chip{fill:#ffffff;stroke:#2f8a7b;stroke-width:1.1}
.d-chiptext{fill:#2f8a7b;font-size:10.5px;font-weight:600;letter-spacing:.02em}
.d-hinweis{fill:#2f8a7b;font-size:11.5px;font-weight:600}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}</style><defs><marker id="dq-s" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-s" d="M0,0.6 L7.6,4 L0,7.4 z"/></marker><marker id="dq-sb" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-s b" d="M0,0.6 L7.6,4 L0,7.4 z"/></marker></defs><rect class="d-bahn" x="4" y="4" width="856" height="272" rx="14"/><text class="d-bahntitel" x="20" y="26">Einmalig: Aufbereitung</text><rect class="d-bahn" x="4" y="296" width="856" height="244" rx="14"/><text class="d-bahntitel" x="20" y="318">Bei jeder Frage</text><rect class="d-kasten" x="20" y="110" width="130" height="70" rx="10"/><text class="d-t" x="85" y="141" text-anchor="middle">PDF der GFF</text><text class="d-d" x="85" y="159" text-anchor="middle">3.062 Seiten</text><rect class="d-kasten" x="180" y="110" width="210" height="70" rx="10"/><text class="d-t" x="285" y="134" text-anchor="middle">Parser</text><text class="d-d" x="285" y="152" text-anchor="middle">Gliederung, Seiten, Fußnoten</text><text class="d-f" x="285" y="170" text-anchor="middle">extract.py · parse.py</text><rect class="d-kasten" x="430" y="52" width="200" height="70" rx="10"/><text class="d-t" x="530" y="76" text-anchor="middle">Textteile</text><text class="d-d" x="530" y="94" text-anchor="middle">13.967 Abschnitte</text><text class="d-f" x="530" y="112" text-anchor="middle">teilen.py</text><rect class="d-kasten" x="430" y="168" width="200" height="70" rx="10"/><text class="d-t" x="530" y="192" text-anchor="middle">Typische Fragen</text><text class="d-d" x="530" y="210" text-anchor="middle">45.775 Fragen von Gemma 4</text><text class="d-f" x="530" y="228" text-anchor="middle">anreichern.py</text><rect class="d-kasten" x="670" y="110" width="170" height="70" rx="10"/><text class="d-t" x="755" y="134" text-anchor="middle">Vektoren</text><text class="d-d" x="755" y="152" text-anchor="middle">Qwen3-Embedding-0.6B</text><text class="d-f" x="755" y="170" text-anchor="middle">einbetten.py</text><rect class="d-chip" x="546.2" y="159" width="71.8" height="18" rx="9"/><text class="d-chiptext" x="582.1" y="172" text-anchor="middle">lokale KI</text><rect class="d-chip" x="756.2" y="101" width="71.8" height="18" rx="9"/><text class="d-chiptext" x="792.1" y="114" text-anchor="middle">lokale KI</text><text class="d-hinweis" x="844" y="26" text-anchor="end">KI-Modelle laufen lokal auf eigener Hardware, ohne Cloud-Dienst</text><path class="d-kasten" d="M880,173 v224 a75,13 0 0 0 150,0 v-224"/><ellipse class="d-kasten" cx="955" cy="173" rx="75" ry="13"/><text class="d-t" x="955" y="279.5" text-anchor="middle">MariaDB</text><text class="d-d" x="955" y="297.5" text-anchor="middle">Text · Fußnoten</text><text class="d-d" x="955" y="315.5" text-anchor="middle">Volltext · Vektoren</text><polyline class="d-p" points="150,145 178,145" marker-end="url(#dq-s)"/><polyline class="d-p" points="390,145 410,145 410,87 428,87" marker-end="url(#dq-s)"/><polyline class="d-p" points="410,145 410,203 428,203" marker-end="url(#dq-s)"/><polyline class="d-p" points="630,87 650,87 650,135 668,135" marker-end="url(#dq-s)"/><polyline class="d-p" points="630,203 650,203 650,155 668,155" marker-end="url(#dq-s)"/><polyline class="d-p" points="840,145 860,145 860,205 878,205" marker-end="url(#dq-s)"/><polyline class="d-p" points="285,180 285,258 878,258" marker-end="url(#dq-s)"/><text class="d-l" x="530" y="252" text-anchor="middle">Text, Fußnoten, Volltextindex</text><rect class="d-kasten" x="20" y="355" width="240" height="70" rx="10"/><text class="d-t" x="140" y="386" text-anchor="middle">KI-Assistent</text><text class="d-d" x="140" y="404" text-anchor="middle">Claude, ChatGPT, Grok, LM Studio</text><rect class="d-kasten" x="670" y="355" width="170" height="70" rx="10"/><text class="d-t" x="755" y="379" text-anchor="middle">MCP-Schnittstelle</text><text class="d-d" x="755" y="397" text-anchor="middle">11 Werkzeuge, Suche</text><text class="d-f" x="755" y="415" text-anchor="middle">mcp_server.php</text><rect class="d-kasten" x="655" y="455" width="200" height="70" rx="10"/><text class="d-t" x="755" y="486" text-anchor="middle">Einbettung der Frage</text><text class="d-d" x="755" y="504" text-anchor="middle">Qwen3 auf der CPU, 0,15 s</text><rect class="d-chip" x="771.2" y="446" width="71.8" height="18" rx="9"/><text class="d-chiptext" x="807.1" y="459" text-anchor="middle">lokale KI</text><polyline class="d-p b" points="260,380 668,380" marker-end="url(#dq-sb)"/><polyline class="d-p b" points="670,402 262,402" marker-end="url(#dq-sb)"/><text class="d-l b" x="465" y="372" text-anchor="middle">Frage und Werkzeugaufrufe · MCP über HTTPS</text><text class="d-l b" x="465" y="420" text-anchor="middle">Fundstellen mit Seite und Link</text><polyline class="d-p b" points="842,390 878,390" marker-end="url(#dq-sb)" marker-start="url(#dq-sb)"/><polyline class="d-p b" points="755,425 755,453" marker-end="url(#dq-sb)"/><text class="d-l b" x="745" y="444" text-anchor="end">Frage</text></svg>
